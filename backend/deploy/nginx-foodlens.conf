# nginx site for FoodLens API behind an existing nginx.
# 1) Obtain a certificate:  sudo certbot certonly --nginx -d <host> --cert-name foodlens
# 2) Replace <host>, copy to /etc/nginx/sites-available/foodlens, link into sites-enabled,
#    then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name <host>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <host>;
    ssl_certificate /etc/letsencrypt/live/foodlens/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodlens/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A 3 MB JPEG is ~4 MB in base64.
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, not append: the API takes the last entry as the client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
